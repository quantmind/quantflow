name: deploy

on: deployment

jobs:
  deploy:
    # the CodeBuild runner of the deploy workflow, defined in the codebuild
    # stack of fluid-hft: it runs as the deploy role, so the job gets its AWS
    # credentials from CodeBuild
    runs-on: codebuild-quantmind-quantflow-deploy-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: read
    env:
      K8S_ENV: ${{ github.event.deployment.environment }}
      IMAGE_TAG: ${{ github.event.deployment.payload.tag }}
      METABLOCK_API_TOKEN: ${{ secrets.METABLOCK_API_TOKEN }}
      METABLOCK_ORG_ID: ${{ secrets.METABLOCK_ORG_ID }}
      RUST_LOG: info

    steps:
      - name: Update deployment status (in_progress)
        if: success()
        uses: chrnorm/deployment-status@v2
        with:
          token: "${{ secrets.TOKEN_DEPLOYMENT }}"
          deployment-id: ${{ github.event.deployment.id }}
          state: "in_progress"
      - name: checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
      - name: checkout vars
        uses: actions/checkout@v4
        with:
          repository: quantmind/metaplatform
          path: metaplatform
          token: ${{ secrets.TOKEN_DEPLOYMENT }}
      # the Kubernetes API endpoint is private: the runner joins the tailnet
      # for the length of the job and reaches it through the vpc-router
      # Connector of the tailscale-connector chart in fluid-hft
      - name: Join the tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: install rops
        uses: quantmind/rops/.github/actions/setup-rops@main
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN_DEPLOYMENT }}
      - name: Install mozilla sops
        uses: mdgreenwald/mozilla-sops-action@v1.4.1
      - name: deploy quantflow
        run: |
          rops charts update
          rops charts deploy \
          quantflow \
          --env ${K8S_ENV} \
          --set image.tag=${IMAGE_TAG} \
          --wait
      - name: Update ingress configuration
        uses: quantmind/metablock-ingress@v2
        with:
          space: quantmind
          path: dev/blocks
      # tailscaled keeps running after the job, and a CodeBuild build only
      # ends once every process in it has exited, so stop it, even when an
      # earlier step failed. Logging out also removes the runner from the
      # tailnet at once.
      - name: Leave the tailnet
        if: always()
        run: |
          sudo tailscale logout || true
          sudo pkill tailscaled || true
      - name: Update deployment status (success)
        if: success()
        uses: chrnorm/deployment-status@v2
        with:
          token: "${{ secrets.TOKEN_DEPLOYMENT }}"
          deployment-id: ${{ github.event.deployment.id }}
          state: "success"
      - name: Update deployment status (failure)
        if: failure()
        uses: chrnorm/deployment-status@v2
        with:
          token: "${{ secrets.TOKEN_DEPLOYMENT }}"
          deployment-id: ${{ github.event.deployment.id }}
          state: "failure"
